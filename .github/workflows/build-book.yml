name: Build book

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            weasyprint \
            fonts-noto-core \
            fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install --upgrade pypdf

      - name: Build PDF and EPUB
        run: ./scripts/export-book.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fran-fraga-till-arbetskamrat
          path: |
            exports/fran-fraga-till-arbetskamrat.pdf
            exports/fran-fraga-till-arbetskamrat.epub
          if-no-files-found: error

      - name: Upload files to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            exports/fran-fraga-till-arbetskamrat.pdf \
            exports/fran-fraga-till-arbetskamrat.epub \
            --clobber
